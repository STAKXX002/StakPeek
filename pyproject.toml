[project]
name = "stakpeek"
version = "0.1.0"
description = "Ask quietly. Your codebase answers."
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-c>=0.23",
    "numpy",
    "sentence-transformers",
    "openai",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]